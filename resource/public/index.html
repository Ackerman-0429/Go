<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoFrame 商城</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f5f6f8;
    color: #1a1a1a;
    line-height: 1.6;
  }
  header {
    background: #fff;
    border-bottom: 1px solid #e8e8e8;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 20px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { font-size: 17px; font-weight: 600; white-space: nowrap; }
  header h1 span { color: #e4393c; }
  #search {
    flex: 1;
    max-width: 420px;
    padding: 9px 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    transition: border-color .15s;
  }
  #search:focus { border-color: #e4393c; }
  .head-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
  .uname { font-size: 13px; color: #444; white-space: nowrap; }
  .btn {
    border: none; border-radius: 8px; padding: 8px 16px;
    font-size: 13px; cursor: pointer; background: #e4393c; color: #fff;
    transition: opacity .15s;
  }
  .btn:hover { opacity: .88; }
  .btn:disabled { background: #ccc; cursor: not-allowed; }
  .btn.ghost { background: #fff; border: 1px solid #ddd; color: #333; }
  .btn.ghost:hover { border-color: #e4393c; color: #e4393c; }
  .link { background: none; border: none; color: #999; font-size: 12px; cursor: pointer; text-decoration: underline; }
  .cart-btn {
    position: relative; display: flex; align-items: center; gap: 6px;
    background: #fff; border: 1px solid #ddd; border-radius: 8px;
    padding: 8px 14px; font-size: 13px; cursor: pointer; color: #333;
  }
  .cart-btn:hover { border-color: #e4393c; color: #e4393c; }
  .badge {
    position: absolute; top: -7px; right: -7px; min-width: 18px; height: 18px;
    border-radius: 9px; background: #e4393c; color: #fff; font-size: 11px;
    font-style: normal; line-height: 18px; text-align: center; padding: 0 4px;
  }
  .badge.hide { display: none; }
  nav {
    background: #fff;
    padding: 0 24px 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .cat {
    padding: 6px 14px;
    border: 1px solid #e0e0e0;
    border-radius: 16px;
    background: #fff;
    font-size: 13px;
    cursor: pointer;
    transition: all .15s;
  }
  .cat:hover { border-color: #e4393c; color: #e4393c; }
  .cat.active { background: #e4393c; border-color: #e4393c; color: #fff; }
  .cat.sub { margin-left: 16px; }
  main { padding: 24px; max-width: 1320px; margin: 0 auto; }
  .meta { font-size: 13px; color: #888; margin-bottom: 16px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 16px;
  }
  .card {
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
    transition: transform .15s, box-shadow .15s;
    cursor: pointer;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(0,0,0,.09);
  }
  .card .pic {
    width: 100%;
    aspect-ratio: 1;
    background: #eee;
    object-fit: cover;
    display: block;
  }
  .card .body { padding: 12px 14px 16px; }
  .card .name {
    font-size: 14px;
    font-weight: 500;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 4px;
    min-height: 44px;
  }
  .card .sub {
    font-size: 12px;
    color: #999;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 10px;
  }
  .card .row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .price { color: #e4393c; font-size: 18px; font-weight: 600; }
  .price small { font-size: 12px; font-weight: 400; }
  .sales { font-size: 12px; color: #aaa; }
  .empty { text-align: center; padding: 60px 0; color: #999; font-size: 14px; }

  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 100;
  }
  .modal.show { display: flex; }
  .modal .box {
    background: #fff;
    border-radius: 12px;
    max-width: 820px;
    width: 100%;
    max-height: 86vh;
    overflow: auto;
    display: grid;
    grid-template-columns: 340px 1fr;
  }
  .modal .pic { width: 100%; aspect-ratio: 1; object-fit: cover; }
  .modal .detail { padding: 28px; }
  .modal h2 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
  .modal .dsub { color: #888; font-size: 13px; margin-bottom: 18px; }
  .modal .dprice { color: #e4393c; font-size: 30px; font-weight: 600; margin-bottom: 6px; }
  .modal .dstock { font-size: 13px; color: #666; margin-bottom: 20px; }
  .modal .dtext {
    font-size: 14px;
    color: #444;
    line-height: 1.8;
    padding-top: 18px;
    border-top: 1px solid #eee;
  }
  .modal .thumbs { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .modal .thumbs img {
    width: 60px; height: 60px; object-fit: cover;
    border-radius: 6px; border: 1px solid #eee;
  }
  .buy { display: flex; gap: 10px; align-items: center; margin: 18px 0 4px; }
  .buy input {
    width: 78px; padding: 9px 10px; border: 1px solid #ddd;
    border-radius: 8px; font-size: 14px; outline: none; text-align: center;
  }
  .buy input:focus { border-color: #e4393c; }
  .close {
    position: absolute; top: 20px; right: 24px;
    width: 34px; height: 34px; border-radius: 50%;
    border: none; background: rgba(255,255,255,.9);
    font-size: 18px; cursor: pointer; color: #333;
  }

  /* 购物车抽屉 */
  .cart-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.4);
    opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 110;
  }
  .cart-mask.show { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: 400px; max-width: 92vw;
    background: #fff; box-shadow: -8px 0 30px rgba(0,0,0,.15);
    transform: translateX(102%); transition: transform .25s; z-index: 120;
    display: flex; flex-direction: column;
  }
  .drawer.show { transform: translateX(0); }
  .drawer .head {
    padding: 18px 20px; border-bottom: 1px solid #eee;
    display: flex; align-items: center; justify-content: space-between;
  }
  .drawer .head h3 { font-size: 15px; font-weight: 600; }
  .drawer .list { flex: 1; overflow: auto; padding: 4px 20px; }
  .ci {
    display: grid; grid-template-columns: 72px 1fr; gap: 12px;
    padding: 14px 0; border-bottom: 1px solid #f2f2f2;
  }
  .ci img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; background: #f2f2f2; }
  .ci .t { font-size: 13px; font-weight: 500; margin-bottom: 2px; }
  .ci .p { color: #e4393c; font-size: 14px; font-weight: 600; }
  .ci .ops { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .ci.invalid { opacity: .55; }
  .ci .warn { font-size: 11px; color: #e4393c; margin-top: 4px; }
  .stepper { display: flex; align-items: center; border: 1px solid #ddd; border-radius: 6px; overflow: hidden; }
  .stepper button {
    width: 26px; height: 26px; border: none; background: #fafafa;
    cursor: pointer; font-size: 14px; line-height: 1; color: #555;
  }
  .stepper button:hover { background: #f0f0f0; }
  .stepper span { min-width: 34px; text-align: center; font-size: 13px; }
  .ci .del { font-size: 12px; color: #999; cursor: pointer; margin-left: auto; background: none; border: none; }
  .ci .del:hover { color: #e4393c; }
  .drawer .foot { padding: 16px 20px; border-top: 1px solid #eee; }
  .drawer .sum {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 12px; font-size: 13px; color: #666;
  }
  .drawer .sum b { color: #e4393c; font-size: 22px; }
  .drawer .sum b small { font-size: 13px; }
  .drawer .foot .btn { width: 100%; padding: 12px; font-size: 15px; }

  /* 登录弹窗 */
  .login-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    display: none; align-items: center; justify-content: center;
    z-index: 130; padding: 20px;
  }
  .login-modal.show { display: flex; }
  .login-box { background: #fff; border-radius: 12px; width: 360px; max-width: 100%; padding: 26px; }
  .login-box h3 { font-size: 17px; margin-bottom: 16px; }
  .tabs { display: flex; gap: 20px; margin-bottom: 18px; border-bottom: 1px solid #eee; }
  .tabs div {
    padding-bottom: 8px; font-size: 14px; color: #888;
    cursor: pointer; border-bottom: 2px solid transparent;
  }
  .tabs div.on { color: #e4393c; border-color: #e4393c; font-weight: 600; }
  .field { margin-bottom: 12px; }
  .field input {
    width: 100%; padding: 10px 12px; border: 1px solid #ddd;
    border-radius: 8px; font-size: 14px; outline: none;
  }
  .field input:focus { border-color: #e4393c; }
  .tip { font-size: 12px; color: #e4393c; min-height: 18px; margin-bottom: 6px; }
  .login-box .btn { width: 100%; padding: 11px; }

  .toast {
    position: fixed; left: 50%; bottom: 48px; transform: translate(-50%, 20px);
    background: rgba(30,30,30,.9); color: #fff; font-size: 13px;
    padding: 10px 20px; border-radius: 20px; opacity: 0;
    transition: all .25s; pointer-events: none; z-index: 200;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* 通用面板：下单、我的订单 */
  .panel-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    display: none; align-items: center; justify-content: center;
    z-index: 140; padding: 20px;
  }
  .panel-modal.show { display: flex; }
  .panel {
    background: #fff; border-radius: 12px; width: 520px; max-width: 100%;
    max-height: 82vh; display: flex; flex-direction: column;
  }
  .panel .ph {
    padding: 16px 20px; border-bottom: 1px solid #eee;
    display: flex; justify-content: space-between; align-items: center;
  }
  .panel .ph h3 { font-size: 15px; font-weight: 600; }
  .panel .pb { padding: 18px 20px; overflow: auto; }
  .panel .pf {
    padding: 14px 20px; border-top: 1px solid #eee;
    display: flex; justify-content: flex-end; gap: 10px; align-items: center;
  }
  .orow { border: 1px solid #eee; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  .orow .oh {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: #999; margin-bottom: 10px;
  }
  .orow .ob { display: flex; gap: 12px; align-items: center; }
  .orow .ob img { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; background: #f2f2f2; }
  .orow .on { flex: 1; font-size: 13px; }
  .orow .os { color: #e4393c; font-weight: 600; font-size: 15px; }
  .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
  .btn.sm { padding: 5px 12px; font-size: 12px; }
  .st-tag { display: inline-block; font-size: 11px; padding: 1px 9px; border-radius: 10px; background: #f5f5f5; color: #666; }
  .st-tag.pending { background: #fff3e0; color: #e67e22; }
  .st-tag.paid { background: #e8f5e9; color: #2e7d32; }
  .st-tag.cancelled { background: #f5f5f5; color: #aaa; }
  .dline { display: flex; justify-content: space-between; font-size: 13px; padding: 7px 0; color: #555; }
  .dline span:last-child { color: #1a1a1a; }
  .ditems { border-top: 1px dashed #eee; margin-top: 10px; padding-top: 10px; }
  .ditem { display: flex; gap: 10px; align-items: center; padding: 8px 0; }
  .ditem img { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; background: #f2f2f2; }
  .ditem .dn { flex: 1; font-size: 13px; }

  @media (max-width: 640px) {
    .modal .box { grid-template-columns: 1fr; }
    main { padding: 16px; }
    header { padding: 12px 16px; gap: 10px; }
    header h1 { display: none; }
  }
</style>
</head>
<body>

<header>
  <h1>GoFrame <span>商城</span></h1>
  <input id="search" type="search" placeholder="搜索商品名称…">
  <div class="head-right">
    <div id="userArea"></div>
    <button class="cart-btn" onclick="openOrders()">📦 我的订单</button>
    <button class="cart-btn" onclick="openCart()">
      🛒 购物车<em id="cartBadge" class="badge hide">0</em>
    </button>
  </div>
</header>

<nav id="cats"></nav>

<main>
  <div class="meta" id="meta">加载中…</div>
  <div class="grid" id="goods"></div>
</main>

<div class="modal" id="modal">
  <button class="close" onclick="closeModal()">×</button>
  <div class="box" id="modalBox"></div>
</div>

<div class="cart-mask" id="cartMask" onclick="closeCart()"></div>
<aside class="drawer" id="drawer">
  <div class="head">
    <h3>购物车</h3>
    <div>
      <button class="link" onclick="clearCart()">清空</button>
      <button class="link" style="margin-left:10px" onclick="closeCart()">关闭</button>
    </div>
  </div>
  <div class="list" id="cartList"></div>
  <div class="foot">
    <div class="sum">
      <span id="cartMeta">共 0 件</span>
      <span>合计 <b id="cartTotal"><small>¥</small>0.00</b></span>
    </div>
    <button class="btn" onclick="checkout()">去结算</button>
  </div>
</aside>

<div class="login-modal" id="loginModal">
  <form class="login-box" onsubmit="return submitAuth(event)">
    <h3>欢迎来到 GoFrame 商城</h3>
    <div class="tabs">
      <div id="tabLogin" class="on" onclick="switchAuth('login')">登录</div>
      <div id="tabReg" onclick="switchAuth('register')">注册</div>
    </div>
    <div class="field"><input id="au" placeholder="用户名" autocomplete="username"></div>
    <div class="field"><input id="ap" type="password" placeholder="密码（6-32 位）" autocomplete="current-password"></div>
    <div class="field" id="nickField" style="display:none">
      <input id="an" placeholder="昵称（可选）">
    </div>
    <div class="tip" id="authTip"></div>
    <button class="btn" id="authBtn" type="submit">登录</button>
  </form>
</div>

<div class="panel-modal" id="checkoutModal">
  <form class="panel" onsubmit="return submitOrder(event)">
    <div class="ph">
      <h3>填写收货信息</h3>
      <button type="button" class="link" onclick="closePanel('checkoutModal')">关闭</button>
    </div>
    <div class="pb">
      <div class="field"><input id="rname" placeholder="收货人姓名"></div>
      <div class="field"><input id="rphone" placeholder="手机号，如 13800138000"></div>
      <div class="field"><input id="raddr" placeholder="收货地址（详细到门牌号）"></div>
      <div class="field"><input id="rremark" placeholder="订单备注（可选）"></div>
      <div class="tip" id="orderTip"></div>
    </div>
    <div class="pf">
      <span style="font-size:13px;color:#666;margin-right:auto">
        应付 <b style="color:#e4393c;font-size:18px" id="ckAmount">¥0.00</b>
      </span>
      <button class="btn" id="orderBtn" type="submit">提交订单</button>
    </div>
  </form>
</div>

<div class="panel-modal" id="orderModal">
  <div class="panel">
    <div class="ph">
      <h3 id="orderPanelTitle">我的订单</h3>
      <button class="link" onclick="closePanel('orderModal')">关闭</button>
    </div>
    <div class="pb" id="orderBox"></div>
    <div class="pf" id="orderFoot" style="display:none">
      <button class="btn ghost sm" onclick="renderOrders()">返回列表</button>
    </div>
  </div>
</div>

<div class="panel-modal" id="profileModal">
  <form class="panel" onsubmit="return submitProfile(event)">
    <div class="ph">
      <h3>个人资料</h3>
      <button type="button" class="link" onclick="closePanel('profileModal')">关闭</button>
    </div>
    <div class="pb">
      <div class="field">
        <input id="pfUser" disabled style="background:#f7f7f7;color:#888">
      </div>
      <div class="field"><input id="pfNick" placeholder="昵称，最多 20 个字符" maxlength="20"></div>
      <div class="field"><input id="pfEmail" placeholder="邮箱（选填，不可与其他账号重复）" maxlength="100"></div>
      <div class="field"><input id="pfPhone" placeholder="手机号（选填，11 位）" maxlength="20"></div>
      <div class="tip" id="profileTip"></div>
    </div>
    <div class="pf">
      <span style="font-size:12px;color:#999;margin-right:auto">用户名是登录身份，不可修改</span>
      <button class="btn ghost sm" type="button" onclick="closePanel('profileModal')">取消</button>
      <button class="btn" id="profileBtn" type="submit">保存</button>
    </div>
  </form>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '';
let currentCat = 0;
let keyword = '';
let catList = [];

let me = null;
let cart = { list: [], totalQuantity: 0, totalAmount: 0, invalidCount: 0 };
let authMode = 'login';
let pendingAdd = null;

async function api(path, opts) {
  const init = Object.assign({ credentials: 'same-origin' }, opts || {});
  if (init.body && typeof init.body !== 'string') {
    init.headers = Object.assign({ 'Content-Type': 'application/json' }, init.headers || {});
    init.body = JSON.stringify(init.body);
  }
  const res = await fetch(API + path, init);
  const json = await res.json();
  if (json.code !== 0) {
    const err = new Error(json.message || '请求失败');
    err.code = json.code;
    throw err;
  }
  return json.data;
}

function money(n) {
  return '<small>¥</small>' + Number(n).toFixed(2);
}

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ---------------- 商品 ---------------- */

async function loadCats() {
  // 接口返回的是 { list: [...] }，不能直接当数组遍历
  catList = (await api('/category/list')).list || [];
  const nav = document.getElementById('cats');
  let html = '<div class="cat active" data-id="0">全部</div>';
  for (const c of catList) {
    const cls = c.parentId ? 'cat sub' : 'cat';
    html += `<div class="${cls}" data-id="${c.id}">${c.name}</div>`;
  }
  nav.innerHTML = html;
  nav.querySelectorAll('.cat').forEach(el => {
    el.onclick = () => {
      nav.querySelectorAll('.cat').forEach(x => x.classList.remove('active'));
      el.classList.add('active');
      currentCat = Number(el.dataset.id);
      loadGoods();
    };
  });
}

async function loadGoods() {
  const grid = document.getElementById('goods');
  const meta = document.getElementById('meta');
  grid.innerHTML = '';
  meta.textContent = '加载中…';

  let path = '/goods/list?pageSize=50';
  if (currentCat) path += '&categoryId=' + currentCat;
  if (keyword) path += '&keyword=' + encodeURIComponent(keyword);

  try {
    const data = await api(path);
    meta.textContent = `共 ${data.total} 件商品`;

    if (!data.list || !data.list.length) {
      grid.innerHTML = '<div class="empty" style="grid-column:1/-1">没有找到商品</div>';
      return;
    }

    grid.innerHTML = data.list.map(g => `
      <div class="card" onclick="openDetail(${g.id})">
        <img class="pic" src="${g.cover}" alt="${g.name}" loading="lazy"
             onerror="this.style.visibility='hidden'">
        <div class="body">
          <div class="name">${g.name}</div>
          <div class="sub">${g.subtitle || ''}</div>
          <div class="row">
            <div class="price">${money(g.price)}</div>
            <div class="sales">已售 ${g.sales}</div>
          </div>
        </div>
      </div>
    `).join('');
  } catch (e) {
    meta.textContent = '加载失败：' + e.message;
  }
}

async function openDetail(id) {
  try {
    const g = await api('/goods/detail?id=' + id);
    const thumbs = (g.images || []).map(src =>
      `<img src="${src}" onerror="this.style.display='none'">`).join('');
    document.getElementById('modalBox').innerHTML = `
      <img class="pic" src="${g.cover}" onerror="this.style.visibility='hidden'">
      <div class="detail">
        <h2>${g.name}</h2>
        <div class="dsub">${g.subtitle || ''}</div>
        <div class="dprice">${money(g.price)}</div>
        <div class="dstock">库存 ${g.stock} 件 · 已售 ${g.sales} 件</div>
        <div class="buy">
          <input id="dq" type="number" value="1" min="1" max="${g.stock}">
          <button class="btn" onclick="addFromDetail(${g.id})">加入购物车</button>
        </div>
        <div class="dtext">${g.detail || '暂无详情'}</div>
        <div class="thumbs">${thumbs}</div>
      </div>`;
    document.getElementById('modal').classList.add('show');
  } catch (e) {
    toast('加载详情失败：' + e.message);
  }
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

document.getElementById('modal').onclick = e => {
  if (e.target.id === 'modal') closeModal();
};

function addFromDetail(goodsId) {
  const qty = Math.max(1, parseInt(document.getElementById('dq').value, 10) || 1);
  addToCart(goodsId, qty);
}

/* ---------------- 登录 ---------------- */

async function refreshMe() {
  try {
    me = await api('/user/info');
  } catch (e) {
    me = null;
  }
  renderUser();
  if (me) {
    await loadCart();
  } else {
    cart = { list: [], totalQuantity: 0, totalAmount: 0, invalidCount: 0 };
    renderCart();
  }
}

function renderUser() {
  const el = document.getElementById('userArea');
  if (me) {
    el.innerHTML = `<span class="uname">👤 ${me.nickname || me.username}</span>
      <button class="link" onclick="openProfile()" style="margin-left:10px">资料</button>
      ${me.role === 1 ? '<a class="link" href="/admin.html" style="margin-left:10px">管理后台</a>' : ''}
      <button class="link" onclick="logout()" style="margin-left:10px">退出</button>`;
  } else {
    el.innerHTML = '<button class="btn ghost" onclick="openLogin()">登录 / 注册</button>';
  }
}

/* ---------------- 个人资料 ---------------- */

function openProfile() {
  if (!me) { openLogin('login'); return; }
  document.getElementById('pfUser').value = me.username;
  document.getElementById('pfNick').value = me.nickname || '';
  document.getElementById('pfEmail').value = me.email || '';
  document.getElementById('pfPhone').value = me.phone || '';
  document.getElementById('profileTip').textContent = '';
  document.getElementById('profileModal').classList.add('show');
}

async function submitProfile(e) {
  e.preventDefault();
  const tip = document.getElementById('profileTip');
  const btn = document.getElementById('profileBtn');
  const payload = {
    nickname: document.getElementById('pfNick').value.trim(),
    email: document.getElementById('pfEmail').value.trim(),
    phone: document.getElementById('pfPhone').value.trim(),
  };

  btn.disabled = true;
  btn.textContent = '保存中…';
  try {
    // 接口返回的就是最新资料，直接替换本地 me，不用再请求 /user/info
    me = await api('/user/profile', { method: 'POST', body: payload });
    renderUser();
    closePanel('profileModal');
    toast('资料已更新');
  } catch (err) {
    tip.textContent = err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = '保存';
  }
  return false;
}

function openLogin(mode) {
  authMode = mode || 'login';
  switchAuth(authMode);
  document.getElementById('authTip').textContent = '';
  document.getElementById('loginModal').classList.add('show');
}

function closeLogin() {
  document.getElementById('loginModal').classList.remove('show');
}

function switchAuth(mode) {
  authMode = mode;
  document.getElementById('tabLogin').classList.toggle('on', mode === 'login');
  document.getElementById('tabReg').classList.toggle('on', mode === 'register');
  document.getElementById('nickField').style.display = mode === 'register' ? 'block' : 'none';
  document.getElementById('authBtn').textContent = mode === 'register' ? '注册并登录' : '登录';
}

async function submitAuth(e) {
  e.preventDefault();
  const tip = document.getElementById('authTip');
  const btn = document.getElementById('authBtn');
  tip.textContent = '';

  const username = document.getElementById('au').value.trim();
  const password = document.getElementById('ap').value;
  const nickname = document.getElementById('an').value.trim();

  if (!username || !password) {
    tip.textContent = '请输入用户名和密码';
    return false;
  }

  btn.disabled = true;
  const label = btn.textContent;
  btn.textContent = '处理中…';
  try {
    if (authMode === 'register') {
      await api('/user/register', { method: 'POST', body: { username, password, nickname } });
    }
    await api('/user/login', { method: 'POST', body: { username, password } });
    closeLogin();
    await refreshMe();
    toast(authMode === 'register' ? '注册成功，已自动登录' : '登录成功');

    // 登录前点过「加入购物车」，登录后补执行
    if (pendingAdd) {
      const p = pendingAdd;
      pendingAdd = null;
      await addToCart(p.goodsId, p.qty);
    }
  } catch (err) {
    tip.textContent = err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = label;
  }
  return false;
}

async function logout() {
  try {
    await api('/user/logout', { method: 'POST' });
  } catch (e) { /* 忽略 */ }
  me = null;
  closeCart();
  await refreshMe();
  toast('已退出登录');
}

/* ---------------- 购物车 ---------------- */

async function loadCart() {
  try {
    cart = await api('/cart/list');
  } catch (e) {
    cart = { list: [], totalQuantity: 0, totalAmount: 0, invalidCount: 0 };
  }
  renderCart();
}

function renderCart() {
  const count = cart.list.reduce((s, i) => s + i.quantity, 0);
  const badge = document.getElementById('cartBadge');
  badge.textContent = count;
  badge.classList.toggle('hide', count === 0);

  const box = document.getElementById('cartList');
  if (!cart.list.length) {
    box.innerHTML = '<div class="empty">购物车还是空的</div>';
  } else {
    box.innerHTML = cart.list.map(i => `
      <div class="ci ${i.available ? '' : 'invalid'}">
        <img src="${i.cover}" onerror="this.style.visibility='hidden'">
        <div>
          <div class="t">${i.name || '商品已删除'}</div>
          <div class="p">${money(i.price)}</div>
          <div class="ops">
            <div class="stepper">
              <button onclick="changeQty(${i.id}, ${i.quantity - 1})">−</button>
              <span>${i.quantity}</span>
              <button onclick="changeQty(${i.id}, ${i.quantity + 1})">+</button>
            </div>
            <button class="del" onclick="removeItem(${i.id})">删除</button>
          </div>
          ${i.available ? '' : `<div class="warn">${i.reason}</div>`}
        </div>
      </div>`).join('');
  }

  document.getElementById('cartTotal').innerHTML = money(cart.totalAmount);
  document.getElementById('cartMeta').textContent =
    `共 ${cart.totalQuantity} 件` + (cart.invalidCount ? ` · ${cart.invalidCount} 件不可结算` : '');
}

function openCart() {
  document.getElementById('drawer').classList.add('show');
  document.getElementById('cartMask').classList.add('show');
  if (me) loadCart();
}

function closeCart() {
  document.getElementById('drawer').classList.remove('show');
  document.getElementById('cartMask').classList.remove('show');
}

async function addToCart(goodsId, qty) {
  if (!me) {
    pendingAdd = { goodsId, qty };
    openLogin('login');
    toast('请先登录');
    return;
  }
  try {
    const d = await api('/cart/add', { method: 'POST', body: { goodsId, quantity: qty } });
    await loadCart();
    toast(`已加入购物车，该商品共 ${d.quantity} 件`);
    openCart();
  } catch (e) {
    if (e.code === 61) {
      pendingAdd = { goodsId, qty };
      openLogin('login');
      return;
    }
    toast(e.message);
  }
}

async function changeQty(id, qty) {
  if (qty <= 0) {
    removeItem(id);
    return;
  }
  try {
    await api('/cart/update', { method: 'POST', body: { id, quantity: qty } });
    await loadCart();
  } catch (e) {
    toast(e.message);
  }
}

async function removeItem(id) {
  try {
    await api('/cart/delete', { method: 'POST', body: { id } });
    await loadCart();
    toast('已从购物车移除');
  } catch (e) {
    toast(e.message);
  }
}

async function clearCart() {
  if (!cart.list.length) return;
  if (!confirm('确定清空购物车？')) return;
  try {
    const d = await api('/cart/clear', { method: 'POST' });
    await loadCart();
    toast(`已清空 ${d.deleted} 项`);
  } catch (e) {
    toast(e.message);
  }
}

/* ---------------- 订单 ---------------- */

function fmt(n) {
  return '¥' + Number(n).toFixed(2);
}

function closePanel(id) {
  document.getElementById(id).classList.remove('show');
}

function checkout() {
  if (!me) { openLogin('login'); return; }
  if (!cart.totalQuantity) { toast('购物车里没有可结算的商品'); return; }
  document.getElementById('ckAmount').textContent = fmt(cart.totalAmount);
  document.getElementById('orderTip').textContent = '';
  document.getElementById('checkoutModal').classList.add('show');
}

async function submitOrder(e) {
  e.preventDefault();
  const tip = document.getElementById('orderTip');
  const btn = document.getElementById('orderBtn');
  const payload = {
    receiverName: document.getElementById('rname').value.trim(),
    receiverPhone: document.getElementById('rphone').value.trim(),
    receiverAddress: document.getElementById('raddr').value.trim(),
    remark: document.getElementById('rremark').value.trim(),
  };
  if (!payload.receiverName || !payload.receiverPhone || !payload.receiverAddress) {
    tip.textContent = '收货人、手机号、地址都必须填写';
    return false;
  }

  btn.disabled = true;
  btn.textContent = '提交中…';
  try {
    const d = await api('/order/create', { method: 'POST', body: payload });
    closePanel('checkoutModal');
    closeCart();
    await loadCart();
    toast(`下单成功，订单号 ${d.orderNo}`);
    document.getElementById('rremark').value = '';
    await openOrders();
  } catch (err) {
    tip.textContent = err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = '提交订单';
  }
  return false;
}

function stTag(o) {
  let cls = '';
  if (o.status === 0) cls = 'pending';
  else if (o.status === 1) cls = 'paid';
  else if (o.status === 4) cls = 'cancelled';
  return `<span class="st-tag ${cls}">${o.statusText}</span>`;
}

async function openOrders() {
  if (!me) { openLogin('login'); return; }
  document.getElementById('orderModal').classList.add('show');
  await renderOrders();
}

async function renderOrders() {
  const box = document.getElementById('orderBox');
  document.getElementById('orderPanelTitle').textContent = '我的订单';
  document.getElementById('orderFoot').style.display = 'none';
  box.innerHTML = '<div class="empty">加载中…</div>';
  try {
    const d = await api('/order/list?pageSize=20');
    if (!d.list.length) {
      box.innerHTML = '<div class="empty">还没有订单</div>';
      return;
    }
    box.innerHTML = d.list.map(o => `
      <div class="orow">
        <div class="oh">
          <span>${o.orderNo}</span>
          ${stTag(o)}
        </div>
        <div class="ob">
          <img src="${o.firstCover}" onerror="this.style.visibility='hidden'">
          <div class="on">
            ${o.firstName}${o.itemCount > 1 ? ` 等 ${o.itemCount} 种` : ''}
            <div style="color:#999;font-size:12px;margin-top:2px">${o.quantity} 件 · ${o.createdAt}</div>
          </div>
          <div class="os">${fmt(o.totalAmount)}</div>
        </div>
        <div class="acts">
          <button class="btn ghost sm" onclick="viewOrder(${o.id})">详情</button>
          ${o.status === 0 ? `<button class="btn ghost sm" onclick="cancelOrder(${o.id})">取消</button>
            <button class="btn sm" onclick="payOrder(${o.id})">立即支付</button>` : ''}
        </div>
      </div>`).join('');
  } catch (e) {
    box.innerHTML = `<div class="empty">加载失败：${e.message}</div>`;
  }
}

async function viewOrder(id) {
  const box = document.getElementById('orderBox');
  document.getElementById('orderPanelTitle').textContent = '订单详情';
  document.getElementById('orderFoot').style.display = 'flex';
  box.innerHTML = '<div class="empty">加载中…</div>';
  try {
    const d = await api('/order/detail?id=' + id);
    box.innerHTML = `
      <div class="dline"><span>订单号</span><span>${d.orderNo}</span></div>
      <div class="dline"><span>状态</span><span>${stTag(d)}</span></div>
      <div class="dline"><span>下单时间</span><span>${d.createdAt}</span></div>
      ${d.paidAt ? `<div class="dline"><span>付款时间</span><span>${d.paidAt}</span></div>` : ''}
      <div class="dline"><span>收货人</span><span>${d.receiverName} ${d.receiverPhone}</span></div>
      <div class="dline"><span>收货地址</span><span style="max-width:62%;text-align:right">${d.receiverAddress}</span></div>
      ${d.remark ? `<div class="dline"><span>备注</span><span>${d.remark}</span></div>` : ''}
      <div class="ditems">
        ${d.items.map(i => `
          <div class="ditem">
            <img src="${i.cover}" onerror="this.style.visibility='hidden'">
            <div class="dn">${i.goodsName}
              <div style="color:#999;font-size:12px">${fmt(i.price)} × ${i.quantity}</div>
            </div>
            <div style="color:#e4393c">${fmt(i.subtotal)}</div>
          </div>`).join('')}
      </div>
      <div class="dline" style="border-top:1px solid #eee;margin-top:8px;padding-top:12px">
        <span>合计</span>
        <span style="color:#e4393c;font-size:18px;font-weight:600">${fmt(d.totalAmount)}</span>
      </div>
      ${d.status === 0 ? `<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:12px">
        <button class="btn ghost sm" onclick="cancelOrder(${d.id})">取消订单</button>
        <button class="btn sm" onclick="payOrder(${d.id})">立即支付</button>
      </div>` : ''}`;
  } catch (e) {
    box.innerHTML = `<div class="empty">加载失败：${e.message}</div>`;
  }
}

async function cancelOrder(id) {
  if (!confirm('确定取消这笔订单？库存会退回。')) return;
  try {
    await api('/order/cancel', { method: 'POST', body: { id } });
    toast('订单已取消');
    await renderOrders();
  } catch (e) {
    toast(e.message);
  }
}

async function payOrder(id) {
  try {
    const d = await api('/order/pay', { method: 'POST', body: { id } });
    toast(`支付成功（模拟）· ${d.paidAt}`);
    await renderOrders();
  } catch (e) {
    toast(e.message);
  }
}

document.getElementById('loginModal').onclick = e => {
  if (e.target.id === 'loginModal') closeLogin();
};

let timer = null;
document.getElementById('search').oninput = e => {
  clearTimeout(timer);
  timer = setTimeout(() => {
    keyword = e.target.value.trim();
    loadGoods();
  }, 300);
};

loadCats().then(loadGoods).catch(e => {
  document.getElementById('meta').textContent = '无法连接后端：' + e.message;
});
refreshMe();
</script>
