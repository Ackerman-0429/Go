<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理后台 · GoShop</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f5f6f8; color: #1a1a1a; line-height: 1.6;
  }
  a { text-decoration: none; }
  header {
    background: #fff; border-bottom: 1px solid #e8e8e8;
    padding: 14px 24px; display: flex; align-items: center; gap: 24px;
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 17px; font-weight: 600; white-space: nowrap; }
  header h1 span { color: #e4393c; }
  .tabs { display: flex; gap: 4px; background: #f2f3f5; padding: 4px; border-radius: 10px; }
  .tabs button {
    border: none; background: none; padding: 6px 18px; border-radius: 8px;
    font-size: 13px; cursor: pointer; color: #555; transition: all .15s;
  }
  .tabs button.on { background: #fff; color: #e4393c; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .head-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .uname { font-size: 13px; color: #444; white-space: nowrap; }
  .btn {
    border: none; border-radius: 8px; padding: 8px 16px; font-size: 13px;
    cursor: pointer; background: #e4393c; color: #fff; transition: opacity .15s;
  }
  .btn:hover { opacity: .88; }
  .btn:disabled { background: #ccc; cursor: not-allowed; }
  .btn.ghost { background: #fff; border: 1px solid #ddd; color: #333; }
  .btn.ghost:hover { border-color: #e4393c; color: #e4393c; }
  .btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 6px; }
  .btn.danger { background: #fff; border: 1px solid #f0c0c0; color: #d33; }
  .btn.danger:hover { background: #fff5f5; border-color: #d33; color: #d33; }

  main { padding: 20px 24px 60px; max-width: 1400px; margin: 0 auto; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .stat {
    background: #fff; border-radius: 12px; padding: 16px 18px;
    border: 1px solid #eee; cursor: default;
  }
  .stat.clickable { cursor: pointer; }
  .stat.clickable:hover { border-color: #e4393c; }
  .stat .k { font-size: 12px; color: #888; }
  .stat .v { font-size: 24px; font-weight: 600; margin-top: 2px; }
  .stat .v small { font-size: 13px; font-weight: 400; color: #888; margin-left: 2px; }
  .stat.warn .v { color: #e4393c; }

  .panel { background: #fff; border-radius: 12px; border: 1px solid #eee; overflow: hidden; }
  .panel.hide { display: none; }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    padding: 14px 16px; border-bottom: 1px solid #f0f0f0;
  }
  .toolbar input, .toolbar select {
    padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px;
    font-size: 13px; outline: none; background: #fff; color: #333;
  }
  .toolbar input:focus, .toolbar select:focus { border-color: #e4393c; }
  .toolbar .grow { flex: 1; }
  .toolbar .spacer { margin-left: auto; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 11px 14px; text-align: left; white-space: nowrap; }
  th { background: #fafafa; color: #666; font-weight: 500; border-bottom: 1px solid #f0f0f0; }
  td { border-bottom: 1px solid #f5f5f5; color: #333; }
  tbody tr:hover { background: #fffcfc; }
  .thumb { width: 38px; height: 38px; border-radius: 6px; object-fit: cover; background: #f2f2f2; vertical-align: middle; }
  .name-cell { display: flex; align-items: center; gap: 10px; }
  .name-cell div { white-space: normal; min-width: 160px; }
  .name-cell small { color: #999; display: block; font-size: 11px; }
  .price { color: #e4393c; font-weight: 600; }
  .tag {
    display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 11px; line-height: 18px;
  }
  .tag.on { background: #eaf7ee; color: #1a9c4a; }
  .tag.off { background: #f3f3f3; color: #999; }
  .tag.s0 { background: #fff7e6; color: #c87a00; }
  .tag.s1 { background: #eef4ff; color: #2b6cd4; }
  .tag.s2 { background: #f0f0ff; color: #5b4dd6; }
  .tag.s3 { background: #eaf7ee; color: #1a9c4a; }
  .tag.s4 { background: #f3f3f3; color: #999; }
  .ops { display: flex; gap: 8px; }
  .muted { color: #999; }
  .pager { display: flex; align-items: center; gap: 12px; padding: 14px 16px; font-size: 13px; color: #666; }
  .pager .spacer { margin-left: auto; }
  .empty { padding: 40px; text-align: center; color: #999; font-size: 13px; }

  /* 弹窗 */
  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none;
    align-items: center; justify-content: center; z-index: 50; padding: 20px;
  }
  .modal.show { display: flex; }
  .dialog {
    background: #fff; border-radius: 14px; width: 100%; max-width: 620px;
    max-height: 90vh; overflow-y: auto; padding: 22px 24px;
  }
  .dialog h3 { font-size: 16px; margin-bottom: 4px; }
  .dialog .hint { font-size: 12px; color: #999; margin-bottom: 16px; }
  .field { margin-bottom: 13px; }
  .field label { display: block; font-size: 12px; color: #666; margin-bottom: 5px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 9px 12px; border: 1px solid #ddd; border-radius: 8px;
    font-size: 13px; font-family: inherit; outline: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: #e4393c; }
  .field textarea { min-height: 70px; resize: vertical; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .dialog-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

  /* 提示 */
  #toast {
    position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(20px);
    background: #333; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: all .25s; z-index: 99;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.err { background: #d33; }

  /* 拦截页：未登录 / 非管理员 */
  #gate {
    position: fixed; inset: 0; background: #f5f6f8; display: none;
    align-items: center; justify-content: center; z-index: 100;
  }
  #gate.show { display: flex; }
  .gate-card {
    background: #fff; border-radius: 14px; padding: 36px 40px; text-align: center;
    max-width: 420px; border: 1px solid #eee;
  }
  .gate-card .icon {
    width: 54px; height: 54px; margin: 0 auto 14px; border-radius: 50%;
    background: #fff0f0; color: #e4393c; font-size: 26px; line-height: 54px;
  }
  .gate-card h2 { font-size: 16px; margin-bottom: 8px; }
  .gate-card p { font-size: 13px; color: #888; margin-bottom: 20px; }
</style>
</head>
<body>

<header>
  <h1>GoShop <span>管理后台</span></h1>
  <nav class="tabs">
    <button data-tab="goods" class="on">商品管理</button>
    <button data-tab="category">分类管理</button>
    <button data-tab="orders">订单管理</button>
    <button data-tab="users">用户管理</button>
  </nav>
  <div class="head-right">
    <span class="uname" id="who"></span>
    <a class="btn ghost" href="/">返回商城</a>
    <button class="btn ghost" id="logoutBtn">退出</button>
  </div>
</header>

<main>
  <section class="stats" id="stats"></section>

  <!-- 商品管理 -->
  <section class="panel" id="panel-goods">
    <div class="toolbar">
      <input id="gKeyword" placeholder="搜索商品名称" style="width:200px">
      <select id="gCategory" style="width:150px"></select>
      <select id="gStatus" style="width:120px">
        <option value="-1">全部状态</option>
        <option value="1">在售</option>
        <option value="0">已下架</option>
      </select>
      <button class="btn ghost sm" id="gSearch">查询</button>
      <button class="btn sm spacer" id="gCreate">+ 新建商品</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:60px">ID</th>
            <th>商品</th>
            <th style="width:110px">价格</th>
            <th style="width:80px">库存</th>
            <th style="width:80px">销量</th>
            <th style="width:90px">状态</th>
            <th style="width:210px">操作</th>
          </tr>
        </thead>
        <tbody id="goodsBody"></tbody>
      </table>
    </div>
    <div class="pager" id="goodsPager"></div>
  </section>

  <!-- 分类管理 -->
  <section class="panel hide" id="panel-category">
    <div class="toolbar">
      <span class="muted" style="font-size:13px">仅支持两级：顶级分类与子分类。停用的分类不再出现在商城前台。</span>
      <button class="btn sm spacer" id="cCreate">+ 新建分类</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:60px">ID</th>
            <th>分类名称</th>
            <th style="width:150px">上级分类</th>
            <th style="width:80px">排序</th>
            <th style="width:90px">商品数</th>
            <th style="width:90px">状态</th>
            <th style="width:150px">操作</th>
          </tr>
        </thead>
        <tbody id="catBody"></tbody>
      </table>
    </div>
    <div class="pager" id="catPager"></div>
  </section>

  <!-- 订单管理 -->
  <section class="panel hide" id="panel-orders">
    <div class="toolbar">
      <select id="oStatus" style="width:140px">
        <option value="-1">全部状态</option>
        <option value="0">待付款</option>
        <option value="1">已付款</option>
        <option value="2">已发货</option>
        <option value="3">已完成</option>
        <option value="4">已取消</option>
      </select>
      <input id="oKeyword" placeholder="订单号 / 收货人" style="width:220px">
      <button class="btn ghost sm" id="oSearch">查询</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:200px">订单号</th>
            <th style="width:90px">用户</th>
            <th>商品</th>
            <th style="width:110px">金额</th>
            <th style="width:90px">状态</th>
            <th>收货人</th>
            <th style="width:150px">下单时间</th>
            <th style="width:160px">操作</th>
          </tr>
        </thead>
        <tbody id="orderBody"></tbody>
      </table>
    </div>
    <div class="pager" id="orderPager"></div>
  </section>

  <!-- 用户管理 -->
  <section class="panel hide" id="panel-users">
    <div class="toolbar">
      <input id="uKeyword" placeholder="用户名 / 昵称 / 邮箱 / 手机号" style="width:240px">
      <select id="uRole" style="width:130px">
        <option value="-1">全部角色</option>
        <option value="1">管理员</option>
        <option value="0">普通用户</option>
      </select>
      <select id="uStatus" style="width:130px">
        <option value="-1">全部状态</option>
        <option value="1">正常</option>
        <option value="0">已禁用</option>
      </select>
      <button class="btn ghost sm" id="uSearch">查询</button>
      <span class="spacer"></span>
      <button class="btn sm" id="uCreate">+ 新建用户</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:60px">ID</th>
            <th>用户</th>
            <th style="width:200px">联系方式</th>
            <th style="width:110px">角色</th>
            <th style="width:90px">状态</th>
            <th style="width:80px">订单</th>
            <th style="width:110px">消费</th>
            <th style="width:230px">操作</th>
          </tr>
        </thead>
        <tbody id="userBody"></tbody>
      </table>
    </div>
    <div class="pager" id="userPager"></div>
  </section>
</main>

<!-- 商品编辑弹窗 -->
<div class="modal" id="goodsModal">
  <div class="dialog">
    <h3 id="goodsTitle">新建商品</h3>
    <p class="hint">售价支持两位小数；图片字段可直接粘贴 JSON 数组字符串。</p>
    <form id="goodsForm">
      <input type="hidden" name="id" id="fId">
      <div class="row2">
        <div class="field">
          <label>所属分类</label>
          <select name="categoryId" id="fCategory"></select>
        </div>
        <div class="field">
          <label>状态</label>
          <select name="status" id="fStatus">
            <option value="1">上架在售</option>
            <option value="0">下架隐藏</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>商品名称</label>
        <input name="name" id="fName" placeholder="2-100 个字符" required>
      </div>
      <div class="field">
        <label>副标题 / 卖点</label>
        <input name="subtitle" id="fSubtitle" placeholder="选填">
      </div>
      <div class="row2">
        <div class="field">
          <label>售价（元）</label>
          <input name="price" id="fPrice" type="number" step="0.01" min="0.01" placeholder="0.00" required>
        </div>
        <div class="field">
          <label>库存</label>
          <input name="stock" id="fStock" type="number" min="0" step="1" value="0">
        </div>
      </div>
      <div class="field">
        <label>封面图 URL</label>
        <input name="cover" id="fCover" placeholder="https://...">
      </div>
      <div class="field">
        <label>多图（JSON 数组）</label>
        <input name="images" id="fImages" placeholder='["url1","url2"]'>
      </div>
      <div class="field">
        <label>商品详情</label>
        <textarea name="detail" id="fDetail"></textarea>
      </div>
      <div class="dialog-foot">
        <button type="button" class="btn ghost" id="goodsCancel">取消</button>
        <button type="submit" class="btn" id="goodsSubmit">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- 分类编辑弹窗 -->
<div class="modal" id="catModal">
  <div class="dialog">
    <h3 id="catTitle">新建分类</h3>
    <p class="hint">排序值越小越靠前；同一父级下不允许重名。</p>
    <form id="catForm">
      <input type="hidden" name="id" id="cId">
      <div class="field">
        <label>上级分类</label>
        <select name="parentId" id="cParent"></select>
      </div>
      <div class="field">
        <label>分类名称</label>
        <input name="name" id="cName" placeholder="2-30 个字符，如「手机数码」" required>
      </div>
      <div class="row2">
        <div class="field">
          <label>排序值</label>
          <input name="sort" id="cSort" type="number" min="0" max="9999" step="1" value="0">
        </div>
        <div class="field">
          <label>状态</label>
          <select name="status" id="cStatus">
            <option value="1">启用</option>
            <option value="0">停用</option>
          </select>
        </div>
      </div>
      <div class="dialog-foot">
        <button type="button" class="btn ghost" id="catCancel">取消</button>
        <button type="submit" class="btn" id="catSubmit">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- 用户编辑弹窗：新建与编辑共用，靠 uId 是否为空区分 -->
<div class="modal" id="userModal">
  <div class="dialog" style="max-width:560px">
    <h3 id="userTitle">编辑用户</h3>
    <p class="hint" id="userHint">角色与状态存在数据库里，改完立即生效，无需等对方重新登录。</p>
    <form id="userForm">
      <input type="hidden" name="id" id="uId">
      <div class="row2" id="uNameRow">
        <div class="field">
          <label>用户名</label>
          <input name="username" id="uUsername" placeholder="3-20 个字符，登录用" maxlength="20">
        </div>
        <div class="field" id="uPwdWrap">
          <label>初始密码</label>
          <input name="password" id="uPassword" placeholder="6-32 个字符" maxlength="32">
        </div>
      </div>
      <div class="field">
        <label>昵称</label>
        <input name="nickname" id="uNick" placeholder="留空则显示用户名" maxlength="20">
      </div>
      <div class="row2">
        <div class="field">
          <label>邮箱</label>
          <input name="email" id="uEmail" placeholder="选填，不可与其他账号重复" maxlength="100">
        </div>
        <div class="field">
          <label>手机号</label>
          <input name="phone" id="uPhone" placeholder="选填，11 位手机号" maxlength="20">
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>角色</label>
          <select name="role" id="uRoleSel">
            <option value="0">普通用户</option>
            <option value="1">管理员</option>
          </select>
        </div>
        <div class="field">
          <label>状态</label>
          <select name="status" id="uStatusSel">
            <option value="1">正常</option>
            <option value="0">禁用</option>
          </select>
        </div>
      </div>
      <div class="dialog-foot">
        <button type="button" class="btn ghost" id="userCancel">取消</button>
        <button type="submit" class="btn" id="userSubmit">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- 重置密码弹窗 -->
<div class="modal" id="pwdModal">
  <div class="dialog" style="max-width:480px">
    <h3>重置密码</h3>
    <p class="hint" id="pwdHint"></p>
    <form id="pwdForm">
      <input type="hidden" id="pwdId">
      <div class="field">
        <label>新密码</label>
        <input type="password" id="pwdNew" placeholder="6-32 个字符" minlength="6" maxlength="32" required>
      </div>
      <div class="field">
        <label>确认新密码</label>
        <input type="password" id="pwdNew2" placeholder="再输入一次" minlength="6" maxlength="32" required>
      </div>
      <div class="dialog-foot">
        <button type="button" class="btn ghost" id="pwdCancel">取消</button>
        <button type="submit" class="btn" id="pwdSubmit">确认重置</button>
      </div>
    </form>
  </div>
</div>

<div id="toast"></div>

<div id="gate">
  <div class="gate-card">
    <div class="icon" id="gateIcon">!</div>
    <h2 id="gateTitle">需要管理员权限</h2>
    <p id="gateDesc">请使用管理员账号登录后再访问后台。</p>
    <a class="btn" href="/" id="gateBtn">返回商城登录</a>
  </div>
</div>

<script>
// ---------------------------------------------------------------------------
// 状态
// ---------------------------------------------------------------------------
const state = {
  tab: 'goods',
  categories: [],
  me: null,
  goods: { page: 1, pageSize: 10, keyword: '', categoryId: 0, status: -1, total: 0 },
  orders: { page: 1, pageSize: 10, keyword: '', status: -1, total: 0 },
  users: { page: 1, pageSize: 10, keyword: '', role: -1, status: -1, total: 0 },
};

// 列表里已含完整字段，编辑弹窗直接从缓存回填，省一次详情请求
let goodsCache = [];

// ---------------------------------------------------------------------------
// 请求封装：统一处理登录态与权限
// ---------------------------------------------------------------------------
async function api(path, opts = {}) {
  const res = await fetch(path, { credentials: 'same-origin', ...opts });
  let json;
  try {
    json = await res.json();
  } catch (e) {
    throw new Error('服务响应异常');
  }
  if (json.code === 61) {
    gate('请先登录', '后台管理需要登录态，请先到商城用管理员账号登录。');
    throw new Error('未登录');
  }
  if (json.code === 40301) {
    gate('需要管理员权限', '当前账号不是管理员，无法进入后台。如需使用，请让管理员把该账号设为管理员角色。');
    throw new Error('无权限');
  }
  if (json.code !== 0) {
    throw new Error(json.message || '请求失败');
  }
  return json.data;
}

function post(path, data) {
  const body = new URLSearchParams();
  Object.keys(data).forEach((k) => body.append(k, data[k] == null ? '' : data[k]));
  return api(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: body.toString(),
  });
}

function gate(title, desc) {
  document.getElementById('gateTitle').textContent = title;
  document.getElementById('gateDesc').textContent = desc;
  document.getElementById('gate').classList.add('show');
}

let toastTimer = null;
function toast(msg, isErr) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, 2200);
}

const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

const money = (n) => '¥' + Number(n || 0).toFixed(2);

// ---------------------------------------------------------------------------
// 概览
// ---------------------------------------------------------------------------
async function loadStats() {
  try {
    const s = await api('/admin/stats');
    const cards = [
      { k: '今日订单', v: s.todayOrderCount + ' 单' },
      { k: '今日销售额', v: money(s.todaySales) },
      { k: '待发货', v: s.pendingShipCount + ' 单', warn: s.pendingShipCount > 0, click: true },
      { k: '累计订单', v: s.totalOrderCount + ' 单' },
      { k: '在售商品', v: s.onSaleGoodsCount + ' 件' },
      { k: '注册用户', v: s.userCount + ' 人' },
    ];
    document.getElementById('stats').innerHTML = cards.map((c) => `
      <div class="stat ${c.warn ? 'warn' : ''} ${c.click ? 'clickable' : ''}"
           ${c.click ? 'onclick="jumpPending()"' : ''}>
        <div class="k">${c.k}</div>
        <div class="v">${c.v}</div>
      </div>`).join('');
  } catch (e) {
    // 权限错误已由 gate 处理
  }
}

function jumpPending() {
  switchTab('orders');
  document.getElementById('oStatus').value = '1';
  state.orders.page = 1;
  state.orders.status = 1;
  loadOrders();
}

function flattenCategories() {
  const tops = state.categories.filter((c) => c.parentId === 0);
  const out = [];
  tops.forEach((t) => {
    out.push({ id: t.id, name: t.name, depth: 0, status: t.status });
    state.categories
      .filter((c) => c.parentId === t.id)
      .forEach((c) => out.push({ id: c.id, name: c.name, depth: 1, status: c.status }));
  });
  // 兜底：父分类不在列表里的孤儿节点也要显示
  state.categories.forEach((c) => {
    if (!out.some((o) => o.id === c.id)) out.push({ id: c.id, name: c.name, depth: 0, status: c.status });
  });
  return out;
}

function renderCategorySelects() {
  const list = flattenCategories();
  // 停用的分类仍要能显示（历史商品可能挂在上面），但标出来避免误选
  const label = (c) => (c.depth ? '　└ ' : '') + c.name + (c.status === 0 ? '（已停用）' : '');

  document.getElementById('gCategory').innerHTML =
    '<option value="0">全部分类</option>' +
    list.map((c) => `<option value="${c.id}">${esc(label(c))}</option>`).join('');

  document.getElementById('fCategory').innerHTML =
    list.map((c) => `<option value="${c.id}">${esc(label(c))}</option>`).join('');
}

function categoryName(id) {
  const c = state.categories.find((x) => x.id === Number(id));
  return c ? c.name : '未分类';
}

let catCache = [];

async function loadCategories() {
  try {
    const d = await api('/admin/category/list');
    catCache = d.list || [];
    state.categories = catCache; // 商品页的筛选/表单下拉共用这份数据

    toast(e.message, true);
  }
}

function renderCategories(list) {
  const body = document.getElementById('catBody');
  if (!list.length) {
    body.innerHTML = '<tr><td colspan="7" class="empty">还没有分类，点右上角新建</td></tr>';
  } else {
    body.innerHTML = list.map((c) => `
      <tr>
        <td class="muted">${c.id}</td>
        <td>${c.parentId ? '　└ ' : ''}${esc(c.name)}${c.children ? `<span style="color:#999;font-size:11px;margin-left:8px">${c.children} 个子分类</span>` : ''}</td>
        <td class="muted">${esc(c.parentName || '—')}</td>
        <td>${c.sort}</td>
        <td>${c.goodsCount}</td>
        <td><span class="tag ${c.status === 1 ? 'on' : 'off'}">${c.status === 1 ? '启用' : '停用'}</span></td>
        <td>

        </td>
      </tr>`).join('');
  }
  document.getElementById('catPager').innerHTML =
    `<span>共 ${list.length} 个分类</span><span class="spacer"></span>`;
}

// 上级分类只能选顶级分类；编辑时排除自己，已有子分类的分类则锁死为顶级
function renderParentSelect(excludeId) {
  const tops = state.categories.filter((c) => c.parentId === 0 && c.id !== excludeId);
  document.getElementById('cParent').innerHTML =
    '<option value="0">顶级分类</option>' +
    tops.map((c) => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
}

function openCatModal() {
  document.getElementById('catForm').reset();
  document.getElementById('cId').value = '';
  document.getElementById('catTitle').textContent = '新建分类';
  renderParentSelect(0);
  document.getElementById('cParent').disabled = false;
  document.getElementById('cParent').value = '0';
  document.getElementById('cStatus').value = '1';
  document.getElementById('cSort').value = '0';
  document.getElementById('catModal').classList.add('show');
}

function editCategory(id) {
  const c = catCache.find((x) => x.id === id);
  if (!c) return;
  document.getElementById('catTitle').textContent = '编辑分类 #' + c.id;
  document.getElementById('cId').value = c.id;
  renderParentSelect(c.id);
  const sel = document.getElementById('cParent');
  sel.value = c.parentId;
  // 已是父级的分类不能再变成别人的子分类，否则会出现第三级
  sel.disabled = c.children > 0;
  document.getElementById('cName').value = c.name;
  document.getElementById('cSort').value = c.sort;
  document.getElementById('cStatus').value = c.status;
  document.getElementById('catModal').classList.add('show');
}

async function submitCategory(e) {
  e.preventDefault();
  const form = new FormData(document.getElementById('catForm'));
  // 上级分类被禁用时不会进 FormData，这里给默认值
  const payload = { id: 0, parentId: 0, sort: 0, status: 1 };
  form.forEach((v, k) => { payload[k] = v; });
  const btn = document.getElementById('catSubmit');
  btn.disabled = true;
  try {
    const d = await post('/admin/category/save', payload);
    toast(payload.id == 0 ? '已创建，ID ' + d.id : '已保存');
    document.getElementById('catModal').classList.remove('show');
    await loadCategories();
    loadGoods(); // 分类名可能改过，商品表格要跟着刷新
  } catch (err) {
    toast(err.message, true);
  } finally {
    btn.disabled = false;
  }
}

async function deleteCategory(id) {
  const c = catCache.find((x) => x.id === id);
  const name = c ? c.name : '#' + id;
  if (!confirm(`确认删除分类「${name}」？`)) return;
  try {
    await post('/admin/category/delete', { id });
    toast('已删除');
    await loadCategories();
    loadGoods();
  } catch (e) {
    toast(e.message, true);
  }
}

// 新建与编辑共用一个弹窗：不传 id 即新建，此时才需要填用户名与初始密码。
// 编辑时用户名只读——它是登录身份，改名会让对方无法用原账号登录。
function openUserModal(id) {
  const form = document.getElementById('userForm');
  form.reset();
  const editing = id != null;
  const u = editing ? userCache.find((x) => x.id === id) : null;

  document.getElementById('userTitle').textContent = editing ? `编辑用户 @${u ? u.username : ''}` : '新建用户';
  document.getElementById('userHint').textContent = editing
    ? '角色与状态存在数据库里，改完立即生效，无需等对方重新登录。密码请用「重置密码」单独处理。'
    : '管理员直接建号：填好初始密码后把账号密码告知用户，登录后可自行修改。';

  const nameEl = document.getElementById('uUsername');
  nameEl.value = editing ? u.username : '';
  nameEl.disabled = editing;
  nameEl.required = !editing;
  document.getElementById('uPassword').required = !editing;
  // 编辑模式不需要密码框，直接不占位，让用户名独占整行
  document.getElementById('uPwdWrap').style.display = editing ? 'none' : '';
  document.getElementById('uNameRow').style.gridTemplateColumns = editing ? '1fr' : '';

  document.getElementById('uId').value = editing ? u.id : '';
  document.getElementById('uNick').value = editing ? u.nickname || '' : '';
  document.getElementById('uEmail').value = editing ? u.email || '' : '';
  document.getElementById('uPhone').value = editing ? u.phone || '' : '';
  document.getElementById('uRoleSel').value = editing ? u.role : 0;
  document.getElementById('uStatusSel').value = editing ? u.status : 1;

  document.getElementById('userModal').classList.add('show');
}

// 兼容原来的调用点与 onclick 里的 editUser
function editUser(id) {
  openUserModal(id);
}

async function submitUser(e) {
  e.preventDefault();
  const id = document.getElementById('uId').value;
  const creating = !id;
  const payload = {
    nickname: document.getElementById('uNick').value.trim(),
    email: document.getElementById('uEmail').value.trim(),
    phone: document.getElementById('uPhone').value.trim(),
    role: document.getElementById('uRoleSel').value,
    status: document.getElementById('uStatusSel').value,
  };
  if (creating) {
    payload.username = document.getElementById('uUsername').value.trim();
    payload.password = document.getElementById('uPassword').value;
  } else {
    payload.id = id;
  }

  const btn = document.getElementById('userSubmit');
  btn.disabled = true;
  try {
    const d = await post(creating ? '/admin/user/create' : '/admin/user/save', payload);
    toast(creating ? `已创建，ID ${d.id}` : '已保存');
    document.getElementById('userModal').classList.remove('show');
    loadUsers();
    loadStats();
  } catch (err) {
    toast(err.message, true);
  } finally {
    btn.disabled = false;
  }
}

// 快速启用/禁用：沿用当前的昵称、邮箱、手机号与角色，只翻转状态。
// 这些字段必须原样回传——save 接口是整体覆盖，漏传等于把它们清空。
async function toggleUser(id) {
  const u = userCache.find((x) => x.id === id);
  if (!u) return;
  const next = u.status === 1 ? 0 : 1;
  const tip = next === 0
    ? `确认禁用「${u.username}」？该账号将立即无法登录，已登录的会话也会失效。`
    : `确认启用「${u.username}」？`;
  if (!confirm(tip)) return;
  try {
    await post('/admin/user/save', {
      id,
      nickname: u.nickname || '',
      email: u.email || '',
      phone: u.phone || '',
      role: u.role,
      status: next,
    });
    toast(next === 1 ? '已启用' : '已禁用');
    loadUsers();
  } catch (e) {
    toast(e.message, true);
  }
}

function openPwd(id) {
  const u = userCache.find((x) => x.id === id);
  if (!u) return;
  const form = document.getElementById('pwdForm');
  form.reset(); // reset 会清掉隐藏域，下面重新赋值
  document.getElementById('pwdId').value = u.id;
  document.getElementById('pwdHint').textContent = `为 @${u.username} 设置新密码，保存后原密码立即失效。`;
  document.getElementById('pwdModal').classList.add('show');
}

async function submitPwd(e) {
  e.preventDefault();
  const id = document.getElementById('pwdId').value;
  const p1 = document.getElementById('pwdNew').value;
  const p2 = document.getElementById('pwdNew2').value;
  if (p1 !== p2) {
    toast('两次输入的密码不一致', true);
    return;
  }
  const btn = document.getElementById('pwdSubmit');
  btn.disabled = true;
  try {
    await post('/admin/user/reset-password', { id, password: p1 });
    toast('密码已重置');
    document.getElementById('pwdModal').classList.remove('show');
  } catch (err) {
    toast(err.message, true);
  } finally {
    btn.disabled = false;
  }
}

// ---------------------------------------------------------------------------
// 分页
// ---------------------------------------------------------------------------
function renderPager(id, page, pageSize, total, onJump) {
  const el = document.getElementById(id);
  const pages = Math.max(1, Math.ceil(total / pageSize));
  el.innerHTML = `
    <span>共 ${total} 条 · 第 ${page} / ${pages} 页</span>
    <span class="spacer"></span>`;
  const prev = document.createElement('button');
  prev.className = 'btn ghost sm';
  prev.textContent = '上一页';
  prev.disabled = page <= 1;
  prev.onclick = () => onJump(page - 1);
  const next = document.createElement('button');
  next.className = 'btn ghost sm';
  next.textContent = '下一页';
  next.disabled = page >= pages;
  next.onclick = () => onJump(page + 1);
  el.appendChild(prev);
  el.appendChild(next);
}

// ---------------------------------------------------------------------------
// Tab 切换与初始化
// ---------------------------------------------------------------------------
function switchTab(tab) {
  state.tab = tab;
  document.querySelectorAll('.tabs button').forEach((b) => {
    b.classList.toggle('on', b.dataset.tab === tab);
  });
  document.getElementById('panel-goods').classList.toggle('hide', tab !== 'goods');
  document.getElementById('panel-category').classList.toggle('hide', tab !== 'category');
  document.getElementById('panel-orders').classList.toggle('hide', tab !== 'orders');
  document.getElementById('panel-users').classList.toggle('hide', tab !== 'users');
  if (tab === 'goods') loadGoods();
  else if (tab === 'category') loadCategories();
  else if (tab === 'orders') loadOrders();
  else loadUsers();
}

async function boot() {
  // 1) 先确认登录态与角色
  try {
    state.me = await api('/user/info');
  } catch (e) {
    gate('请先登录', '后台管理需要登录态，请先到商城用管理员账号登录。');
    return;
  }
  document.getElementById('who').textContent = `👤 ${state.me.nickname || state.me.username}`;

  // 2) 概览与分类（后台接口，含停用分类）
  await loadStats();
  await loadCategories();

  // 3) 默认展示商品
  loadGoods();

  // 4) 事件绑定
  document.querySelectorAll('.tabs button').forEach((b) => {
    b.onclick = () => switchTab(b.dataset.tab);
  });
  document.getElementById('gSearch').onclick = () => {
    state.goods.keyword = document.getElementById('gKeyword').value.trim();
    state.goods.categoryId = document.getElementById('gCategory').value;
    state.goods.status = document.getElementById('gStatus').value;
    state.goods.page = 1;
    loadGoods();
  };
  document.getElementById('gCreate').onclick = openGoodsModal;
  document.getElementById('cCreate').onclick = openCatModal;
  document.getElementById('catCancel').onclick = () => {
    document.getElementById('catModal').classList.remove('show');
  };
  document.getElementById('catForm').onsubmit = submitCategory;
  document.getElementById('uSearch').onclick = () => {
    state.users.keyword = document.getElementById('uKeyword').value.trim();
    state.users.role = document.getElementById('uRole').value;
    state.users.status = document.getElementById('uStatus').value;
    state.users.page = 1;
    loadUsers();
  };
  document.getElementById('uRole').onchange = () => document.getElementById('uSearch').click();
  document.getElementById('uStatus').onchange = () => document.getElementById('uSearch').click();
  document.getElementById('uCreate').onclick = () => openUserModal();
  document.getElementById('userCancel').onclick = () => {
    document.getElementById('userModal').classList.remove('show');
  };
  document.getElementById('userForm').onsubmit = submitUser;
  document.getElementById('pwdCancel').onclick = () => {
    document.getElementById('pwdModal').classList.remove('show');
  };
  document.getElementById('pwdForm').onsubmit = submitPwd;
  document.getElementById('goodsCancel').onclick = () => {
    document.getElementById('goodsModal').classList.remove('show');
  };
  document.getElementById('goodsForm').onsubmit = submitGoods;
  document.getElementById('oSearch').onclick = () => {
    state.orders.keyword = document.getElementById('oKeyword').value.trim();
    state.orders.status = document.getElementById('oStatus').value;
    state.orders.page = 1;
    loadOrders();
  };
  document.getElementById('oStatus').onchange = () => {
    state.orders.status = document.getElementById('oStatus').value;
    state.orders.page = 1;
    loadOrders();
  };
  document.getElementById('logoutBtn').onclick = async () => {
    try { await post('/user/logout', {}); } catch (e) { /* 忽略 */ }
    location.href = '/';
  };
}

boot();
</script>
</body>
</html>
